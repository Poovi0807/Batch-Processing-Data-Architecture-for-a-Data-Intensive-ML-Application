# Batch-processing data architecture for a data-intensive ML application
# Dataset: BGL supercomputer system logs (Loghub)
#
# 13 containers, grouped by stage. Everything runs on one private network ("backend").
# Web pages are only reachable from this computer (127.0.0.1):
#   http://localhost:8501  pipeline dashboard      http://localhost:8080  Airflow
#   http://localhost:9870  HDFS                    http://localhost:8090  Spark

name: batch-pipeline

services:

  # ================================================================== STORAGE: HDFS
  hdfs-namenode:                       # knows where every file is
    build: ./hdfs
    image: batch-pipeline/hdfs:3.4.3
    command: ["hdfs", "namenode"]
    env_file: ./hdfs/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name     # formats HDFS on the very first start
    volumes: [namenode-data:/hadoop/dfs]
    ports: ["127.0.0.1:9870:9870"]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9870"]
      interval: 15s
      retries: 10

  hdfs-datanode-1:                     # stores the data (copy 1)
    build: ./hdfs
    image: batch-pipeline/hdfs:3.4.3
    command: ["hdfs", "datanode"]
    env_file: ./hdfs/hadoop.env
    volumes: [datanode1-data:/hadoop/dfs]
    networks: [backend]
    restart: unless-stopped
    depends_on: {hdfs-namenode: {condition: service_healthy}}

  hdfs-datanode-2:                     # stores the data (copy 2)
    build: ./hdfs
    image: batch-pipeline/hdfs:3.4.3
    command: ["hdfs", "datanode"]
    env_file: ./hdfs/hadoop.env
    volumes: [datanode2-data:/hadoop/dfs]
    networks: [backend]
    restart: unless-stopped
    depends_on: {hdfs-namenode: {condition: service_healthy}}

  hdfs-init:                           # runs once: creates the 3 data-lake zones for user "etl"
    build: ./hdfs
    image: batch-pipeline/hdfs:3.4.3
    env_file: ./hdfs/hadoop.env
    networks: [backend]
    command:
      - bash
      - -c
      - |
        hdfs dfsadmin -safemode wait &&
        hdfs dfs -mkdir -p /data/raw /data/processed /data/curated &&
        hdfs dfs -chown -R etl /data && hdfs dfs -chmod -R 750 /data &&
        echo "data lake ready"
    depends_on: [hdfs-datanode-1, hdfs-datanode-2]

  # ================================================================== INGESTION
  ingest:                              # copies one monthly file into HDFS when Airflow asks
    build: ./ingest
    image: batch-pipeline/ingest:1.0
    volumes:
      - ./data/landing:/data/landing
      - ./data/download:/data/download
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 15s

  # ================================================================== PROCESSING: Spark
  spark-master:                        # distributes the work
    build: ./spark
    image: batch-pipeline/spark:4.2.0
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["127.0.0.1:8090:8080"]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]   # web page of the master
      interval: 15s
      start_period: 60s
      retries: 10

  spark-worker-1:                      # does the work
    build: ./spark
    image: batch-pipeline/spark:4.2.0
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment: {SPARK_WORKER_CORES: "2", SPARK_WORKER_MEMORY: "2g", HADOOP_USER_NAME: etl}
    networks: [backend]
    restart: unless-stopped
    depends_on: {spark-master: {condition: service_healthy}}

  spark-worker-2:                      # does the work
    build: ./spark
    image: batch-pipeline/spark:4.2.0
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment: {SPARK_WORKER_CORES: "2", SPARK_WORKER_MEMORY: "2g", HADOOP_USER_NAME: etl}
    networks: [backend]
    restart: unless-stopped
    depends_on: {spark-master: {condition: service_healthy}}

  spark-gateway:                       # starts a Spark job when Airflow asks
    build: ./spark
    image: batch-pipeline/spark:4.2.0
    hostname: spark-gateway
    command: ["python3", "/opt/gateway.py"]
    environment:
      HADOOP_USER_NAME: etl
      ETL_PASSWORD: ${ETL_PASSWORD}
    networks: [backend]
    restart: unless-stopped
    depends_on: [spark-worker-1, spark-worker-2]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 15s

  # ================================================================== DELIVERY: PostgreSQL
  serving-db:                          # feature table for the ML application + audit table
    image: postgres:17
    environment:
      POSTGRES_DB: serving
      POSTGRES_USER: serving_admin
      POSTGRES_PASSWORD: ${SERVING_ADMIN_PASSWORD}
      ETL_PASSWORD: ${ETL_PASSWORD}
      ML_PASSWORD: ${ML_PASSWORD}
    volumes:
      - serving-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports: ["127.0.0.1:5433:5432"]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serving_admin -d serving"]
      interval: 10s

  # ================================================================== ORCHESTRATION: Airflow
  airflow-db:                          # Airflow's own memory (runs, logs, states)
    image: postgres:17
    environment: {POSTGRES_DB: airflow, POSTGRES_USER: airflow, POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD}"}
    volumes: [airflow-db-data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s

  airflow:                             # runs the two pipelines; starts them by itself
    image: apache/airflow:3.3.2
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"     # start the DAGs automatically
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # no login (page only reachable locally)
      ETL_PASSWORD: ${ETL_PASSWORD}
      ML_PASSWORD: ${ML_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./data/landing:/data/landing:ro
    ports: ["127.0.0.1:8080:8080"]
    networks: [backend]
    restart: unless-stopped
    depends_on:
      airflow-db: {condition: service_healthy}
      serving-db: {condition: service_healthy}
      ingest: {condition: service_healthy}
      spark-gateway: {condition: service_healthy}
      hdfs-init: {condition: service_completed_successfully}

  # ================================================================== MONITORING
  dashboard:                           # read-only page: where is my data?
    build: ./dashboard
    image: batch-pipeline/dashboard:1.0
    environment: {ETL_PASSWORD: "${ETL_PASSWORD}"}
    volumes: [./data/landing:/data/landing:ro]
    ports: ["127.0.0.1:8501:8501"]
    networks: [backend]
    restart: unless-stopped

networks:
  backend:

volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  serving-data:
  airflow-db-data: